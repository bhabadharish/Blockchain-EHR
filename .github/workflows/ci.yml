name: CI - Build, Test & Architecture Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit, Integration & Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify core package imports
        run: |
          python -c "import streamlit, torch, sklearn, web3, cryptography, plotly, joblib, psutil; print('All core packages loaded successfully.')"

      - name: Run PyTest test suite
        run: |
          pytest -v tests/

      - name: Validate research artifacts integrity
        run: |
          python scripts/validate_artifacts.py
